# Build the CAPDO controller image from this fork and push it to GHCR.
# Uses the built-in GITHUB_TOKEN (packages:write) — no PAT or SSH keys needed.
name: build-push-ghcr

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra tag to publish (defaults to v1.6.0-devcloud)"
        required: false
        default: "v1.6.0-devcloud"

env:
  IMAGE_NAME: cluster-api-do-controller

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute ldflags
        run: |
          echo "LDFLAGS=$(hack/version.sh)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          TAG="${{ github.event.inputs.tag || 'v1.6.0-devcloud' }}"
          {
            echo "TAGS<<EOF"
            echo "ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${TAG}"
            echo "ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${TAG}-${GITHUB_SHA::7}"
            echo "ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:main"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.TAGS }}
          build-args: |
            ldflags=${{ env.LDFLAGS }}
            ARCH=amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print digest
        run: |
          echo "Image: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}"
          echo "Commit: ${{ github.sha }}"
